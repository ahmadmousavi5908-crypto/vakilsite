name: Scaffold MAVIS article image migration

on:
  push:
    branches:
      - feature/mavis-article-images-active-editor
    paths:
      - "ops/mavis-image-migration-scaffold.trigger"

permissions:
  contents: write

concurrency:
  group: mavis-article-image-migration-scaffold
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify pinned stable Supabase CLI
        run: |
          npx --yes supabase@3.0.0 --version
          npx --yes supabase@3.0.0 migration new --help

      - name: Generate the timestamped migration with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@3.0.0 migration new mavis_article_images
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*_mavis_article_images.sql' | sort)
          if [ "${#MIGRATIONS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one timestamped MAVIS article image migration."
            exit 1
          fi
          MIGRATION_FILE="${MIGRATIONS[0]}"
          test -s ops/migrations/mavis-article-images.sql
          cp ops/migrations/mavis-article-images.sql "$MIGRATION_FILE"
          test -s "$MIGRATION_FILE"
          echo "Generated migration: $MIGRATION_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "Migration source SHA256:"
          sha256sum "$MIGRATION_FILE"

      - name: Commit the CLI-generated migration to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_mavis_article_images.sql
          git rm ops/mavis-image-migration-scaffold.trigger
          git commit -m "chore(db): scaffold MAVIS article image migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
