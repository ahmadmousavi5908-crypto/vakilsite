name: Migrate MAVIS production database

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply migrations 019 and 020 only after the complete production baseline is verified (otherwise dry-run only)"
        required: true
        type: boolean
        default: false
      backup_confirmed:
        description: "Confirm a current recoverable Supabase production backup exists"
        required: true
        type: boolean
        default: false
      deploy_production:
        description: "After migration verification, trigger and wait for the Production Worker deployment"
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: mavis-production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Verify the complete baseline before optionally applying MAVIS migrations 019 and 020
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
    steps:
      - name: Check out the reviewed main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate production target and explicit apply confirmations
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PRODUCTION_DB_URL"
          echo "::add-mask::$SUPABASE_PRODUCTION_DB_URL"
          node --input-type=module <<'NODE'
          const url = new URL(process.env.SUPABASE_PRODUCTION_DB_URL);
          const projectRef = "jroflcmiczfwtmiaxmpd";
          const validDirect = url.hostname === `db.${projectRef}.supabase.co` && decodeURIComponent(url.username) === "postgres";
          const validPooler = url.hostname.endsWith(".pooler.supabase.com") && decodeURIComponent(url.username).includes(projectRef);
          if (!["postgres:", "postgresql:"].includes(url.protocol) || (!validDirect && !validPooler)) {
            throw new Error("The configured database URL does not identify the expected production Supabase project.");
          }
          console.log("Production database target verified by project reference; credentials remain masked.");
          NODE
          if [ "${{ inputs.apply_migrations }}" = "true" ] && [ "${{ inputs.backup_confirmed }}" != "true" ]; then
            echo "::error::A current recoverable production backup must be confirmed before applying migrations."
            exit 1
          fi
          if [ "${{ inputs.deploy_production }}" = "true" ] && { [ "${{ inputs.apply_migrations }}" != "true" ] || [ "${{ inputs.backup_confirmed }}" != "true" ]; }; then
            echo "::error::Production deployment is allowed only after an explicitly confirmed backup and migration apply."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pin Supabase CLI
        run: npx --yes supabase@3.0.0 --version

      - name: Block migration unless the complete production baseline is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PRODUCTION_DB_URL:-}" ]; then
            echo "::error::Production database URL is not configured."
            exit 1
          fi
          echo "::add-mask::${SUPABASE_PRODUCTION_DB_URL}"
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          readonly_psql() {
            PGOPTIONS='-c default_transaction_read_only=on' PGSSLMODE=require \
              psql "$SUPABASE_PRODUCTION_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "$1"
          }

          HISTORY_EXISTS="$(readonly_psql "SELECT to_regclass('supabase_migrations.schema_migrations') IS NOT NULL")"
          if [ "$HISTORY_EXISTS" != "t" ]; then
            echo "::error::Production migration history is missing. Do not run db push; reconcile and verify the existing schema baseline first."
            exit 1
          fi

          BASELINE_COUNT="$(readonly_psql "SELECT count(DISTINCT version) FROM supabase_migrations.schema_migrations WHERE version IN ('001','002','003','005','006','007','008','009','010','011','012','013','014','015','016','017','018')")"
          if [ "$BASELINE_COUNT" != "18" ]; then
            echo "::error::Production does not have all 18 prerequisite migrations recorded. The 019/020-only workflow is blocked."
            exit 1
          fi

          CANONICAL_TABLE="$(readonly_psql "SELECT to_regclass('public.mavis_editorial_articles') IS NOT NULL")"
          COMPATIBILITY_VIEW="$(readonly_psql "SELECT COALESCE((SELECT relkind = 'v' FROM pg_class WHERE oid = to_regclass('public.mavis_articles')), false)")"
          PUBLISH_FUNCTIONS="$(readonly_psql "SELECT to_regprocedure('public.publish_mavis_article(uuid,integer)') IS NOT NULL AND to_regprocedure('public.unpublish_mavis_article(uuid,integer)') IS NOT NULL AND to_regprocedure('public.get_mavis_published_articles()') IS NOT NULL")"
          if [ "$CANONICAL_TABLE" != "t" ] || [ "$COMPATIBILITY_VIEW" != "t" ] || [ "$PUBLISH_FUNCTIONS" != "t" ]; then
            echo "::error::Production MAVIS canonical table, compatibility view, or publication RPCs are incomplete. Migration apply is blocked."
            exit 1
          fi

          echo "Production baseline verified. Only migrations 019 and 020 may proceed."

      - name: Verify remote migration history and SQL parity
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@3.0.0 migration list --remote="$SUPABASE_PRODUCTION_DB_URL"
          TEMP_WORKDIR="$(mktemp -d)"
          npx --yes supabase@3.0.0 --workdir "$TEMP_WORKDIR" init --force
          npx --yes supabase@3.0.0 --workdir "$TEMP_WORKDIR" migration fetch --remote="$SUPABASE_PRODUCTION_DB_URL"
          REMOTE_DIR="$TEMP_WORKDIR/supabase/migrations"
          mapfile -t REMOTE_FILES < <(find "$REMOTE_DIR" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          mapfile -t LOCAL_FILES < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [ "${#REMOTE_FILES[@]}" -gt "${#LOCAL_FILES[@]}" ]; then
            echo "::error::Production has migration versions missing from this repository revision."
            exit 1
          fi
          node - "$REMOTE_DIR" "supabase/migrations" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [remoteDir, localDir] = process.argv.slice(2);
          function normalizeSql(source) {
            let output = "";
            let index = 0;
            let state = "normal";
            let blockDepth = 0;
            let dollarTag = "";

            const addSpace = () => {
              if (output && !output.endsWith(" ")) output += " ";
            };

            while (index < source.length) {
              const current = source[index];
              const next = source[index + 1];

              if (state === "normal") {
                if (current === "-" && next === "-") {
                  index += 2;
                  while (index < source.length && source[index] !== "\n" && source[index] !== "\r") index++;
                  addSpace();
                  continue;
                }
                if (current === "/" && next === "*") {
                  state = "block";
                  blockDepth = 1;
                  index += 2;
                  addSpace();
                  continue;
                }
                if (current === "'") {
                  output += current;
                  state = "single";
                  index++;
                  continue;
                }
                if (current === '"') {
                  output += current;
                  state = "double";
                  index++;
                  continue;
                }
                if (current === "$") {
                  const match = source.slice(index).match(/^\$[A-Za-z_][A-Za-z0-9_]*\$|^\$\$/);
                  if (match) {
                    dollarTag = match[0];
                    output += dollarTag;
                    state = "dollar";
                    index += dollarTag.length;
                    continue;
                  }
                }
                if (/\s/.test(current)) {
                  addSpace();
                  index++;
                  continue;
                }
                if (current === ";") {
                  output = output.trimEnd() + ";";
                  index++;
                  while (index < source.length && /\s/.test(source[index])) index++;
                  continue;
                }
                output += current;
                index++;
                continue;
              }

              if (state === "single") {
                output += current;
                index++;
                if (current === "'" && next === "'") {
                  output += next;
                  index++;
                } else if (current === "'" ) {
                  state = "normal";
                } else if (current === "\\" && index < source.length) {
                  output += source[index++];
                }
                continue;
              }

              if (state === "double") {
                output += current;
                index++;
                if (current === '"' && next === '"') {
                  output += next;
                  index++;
                } else if (current === '"') {
                  state = "normal";
                }
                continue;
              }

              if (state === "dollar") {
                if (source.startsWith(dollarTag, index)) {
                  output += dollarTag;
                  index += dollarTag.length;
                  state = "normal";
                } else {
                  output += current;
                  index++;
                }
                continue;
              }

              if (state === "block") {
                if (current === "/" && next === "*") {
                  blockDepth++;
                  index += 2;
                } else if (current === "*" && next === "/") {
                  blockDepth--;
                  index += 2;
                  if (blockDepth === 0) state = "normal";
                } else {
                  index++;
                }
              }
            }

            return output.trim();
          }

          const remoteFiles = fs.readdirSync(remoteDir).filter((name) => name.endsWith(".sql")).sort();
          const localFiles = fs.readdirSync(localDir).filter((name) => name.endsWith(".sql")).sort();
          const missing = remoteFiles.filter((name) => !localFiles.includes(name));
          if (missing.length) throw new Error("Production migration history contains unknown files: " + missing.join(", "));
          for (const name of remoteFiles) {
            const remoteSql = normalizeSql(fs.readFileSync(path.join(remoteDir, name), "utf8"));
            const localSql = normalizeSql(fs.readFileSync(path.join(localDir, name), "utf8"));
            if (remoteSql !== localSql) throw new Error("Migration SQL differs from the applied production file: " + name);
          }
          const pending = localFiles.filter((name) => !remoteFiles.includes(name));
          const allowedPending = new Set([
            "019_mavis_editorial_assistant_and_manual_sources.sql",
            "020_mavis_legal_record_types.sql",
          ]);
          const unexpected = pending.filter((name) => !allowedPending.has(name));
          if (unexpected.length) {
            throw new Error("Production has unexpected pending migrations: " + unexpected.join(", "));
          }
          console.log("Production history is consistent. Only reviewed MAVIS migrations 019 and 020 may be pending.");
          NODE

      - name: Preview the production migration plan
        run: npx --yes supabase@3.0.0 db push --dry-run --remote="$SUPABASE_PRODUCTION_DB_URL"

      - name: Apply the approved migration
        if: ${{ inputs.apply_migrations == true && inputs.backup_confirmed == true }}
        run: npx --yes supabase@3.0.0 db push --yes --remote="$SUPABASE_PRODUCTION_DB_URL"

      - name: Verify production migration history after apply
        if: ${{ inputs.apply_migrations == true && inputs.backup_confirmed == true }}
        run: |
          set -euo pipefail
          npx --yes supabase@3.0.0 migration list --remote="$SUPABASE_PRODUCTION_DB_URL"

      - name: Trigger Production Worker deployment after verified migration
        if: ${{ inputs.apply_migrations == true && inputs.backup_confirmed == true && inputs.deploy_production == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$CURRENT_MAIN" != "$EXPECTED_SHA" ]; then
            echo "::error::main changed while the production migration was running. Review the new main revision before deploying."
            exit 1
          fi

          gh workflow run deploy-cloudflare.yml --ref main
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow deploy-cloudflare.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,headSha,createdAt --jq 'map(select(.headSha == env.EXPECTED_SHA)) | sort_by(.createdAt) | last | .databaseId // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Production deployment was dispatched but its run ID could not be located."
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status
