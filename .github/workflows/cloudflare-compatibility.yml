name: Cloudflare compatibility audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/cloudflare-edge-middleware-20261113
  pull_request:
    branches:
      - work/mother-two-updated-mavis-20261110
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-compatibility.yml"

permissions:
  contents: read

jobs:
  vinext-compatibility:
    name: Read-only vinext compatibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan Next.js compatibility
        run: npx --yes vinext@1.3.1 check

  opennext-adapter-build:
    name: OpenNext build, bundle validation, and local Workers runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply isolated Next.js security patch for adapter test
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies.next = "16.4.6";
            pkg.devDependencies["eslint-config-next"] = "16.4.6";
            pkg.allowScripts = { ...(pkg.allowScripts || {}), "unrs-resolver@1.12.2": true };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Upload generated Next.js 16.4.6 dependency files
        uses: actions/upload-artifact@v4
        with:
          name: next-16.4.6-dependency-files
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Verify isolated framework versions
        run: npm ls next eslint-config-next

      - name: Install isolated Cloudflare adapter tooling
        run: >-
          npm install --no-save --package-lock=false --no-audit --no-fund
          @opennextjs/cloudflare@1.20.17
          wrangler@4.161.0

      - name: Build Next.js for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      - name: Validate Worker bundle size without deploying
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run 2>&1 | tee /tmp/wrangler-dry-run.log
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const log = fs.readFileSync("/tmp/wrangler-dry-run.log", "utf8");
          const match = log.match(/Total Upload:\s*([\d.]+)\s*(B|KiB|MiB|GiB)/i);
          if (!match) {
            console.error("Could not read Wrangler's Total Upload size from dry-run output.");
            process.exit(1);
          }
          const units = { B: 1, KiB: 1024, MiB: 1024 ** 2, GiB: 1024 ** 3 };
          const bytes = Number(match[1]) * units[match[2]];
          const limit = 64 * 1024 ** 2;
          console.log(`Worker bundle: ${(bytes / 1024 / 1024).toFixed(2)} MiB uncompressed; Cloudflare limit: 64 MiB.`);
          if (bytes > limit) process.exit(1);
          NODE

      - name: Profile Worker startup locally
        run: npx wrangler check startup

      - name: Smoke-test the Cloudflare Workers runtime locally
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare preview --ip 127.0.0.1 --port 8787 > /tmp/opennext-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8787/ -o /tmp/vakilsite-home.html; then
              ready=true
              break
            fi
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
              cat /tmp/opennext-preview.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat /tmp/opennext-preview.log
            echo "Cloudflare Workers preview did not become ready within 60 seconds."
            exit 1
          fi

          for route in /about /legal-library /admin/login; do
            output="/tmp/vakilsite-route.html"
            if [ "$route" = "/about" ]; then output="/tmp/vakilsite-about.html"; fi
            status="$(curl --silent --show-error -o "$output" -w '%{http_code}' "http://127.0.0.1:8787$route")"
            echo "$route -> HTTP $status"
            if [ "$status" != "200" ]; then
              cat /tmp/opennext-preview.log
              exit 1
            fi
          done

          connectivity="$(curl --silent --show-error --fail http://127.0.0.1:8787/api/mavis/connectivity)"
          node --input-type=module -e '
            const data = JSON.parse(process.argv[1]);
            if (data.status !== "ok" || data.service !== "mavis-connectivity") {
              console.error("Unexpected MAVIS connectivity response:", data);
              process.exit(1);
            }
            console.log("MAVIS connectivity endpoint: OK");
          ' "$connectivity"

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const html = ["/tmp/vakilsite-home.html", "/tmp/vakilsite-about.html"]
            .map((file) => fs.readFileSync(file, "utf8"))
            .join("\n");
          const imageSources = [...html.matchAll(/src="([^"]+)"/g)].map((entry) => entry[1]);
          const imageSource = imageSources.find((source) => source.includes("/_next/image?"));
          if (!imageSource) {
            console.log("No Next.js image optimizer URL found in the homepage/about smoke pages.");
            process.exit(0);
          }
          const imageUrl = new URL(imageSource.replaceAll("&amp;", "&"), "http://127.0.0.1:8787");
          const response = await fetch(imageUrl, { signal: AbortSignal.timeout(15000) });
          const contentType = response.headers.get("content-type") || "";
          console.log(`Image optimizer -> HTTP ${response.status} (${contentType})`);
          if (!response.ok || !contentType.startsWith("image/")) {
            console.error("Next.js image optimization failed in the Workers runtime.");
            process.exit(1);
          }
          NODE
