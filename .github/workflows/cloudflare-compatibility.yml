name: Cloudflare compatibility audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/cloudflare-compatibility-20261111
  pull_request:
    branches:
      - work/mother-two-updated-mavis-20261110
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - ".github/workflows/cloudflare-compatibility.yml"

permissions:
  contents: read

jobs:
  vinext-compatibility:
    name: Read-only vinext compatibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan Next.js compatibility
        run: npx --yes vinext@1.3.1 check

  opennext-adapter-build:
    name: Read-only OpenNext Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply isolated Next.js security patch for adapter test
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies.next = "16.4.6";
            pkg.devDependencies["eslint-config-next"] = "16.4.6";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify isolated framework versions
        run: npm ls next eslint-config-next

      - name: Install isolated Cloudflare adapter tooling
        run: >-
          npm install --no-save --package-lock=false --no-audit --no-fund
          @opennextjs/cloudflare@1.20.16
          wrangler@4.160.0

      - name: Build Next.js for Cloudflare Workers
        run: npx opennextjs-cloudflare build
