name: Cloudflare compatibility audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - work/mother-two-updated-mavis-20261110
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - ".github/workflows/cloudflare-compatibility.yml"

permissions:
  contents: read

jobs:
  vinext-compatibility:
    name: Read-only vinext compatibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan Next.js compatibility
        run: npx --yes vinext@1.3.1 check
