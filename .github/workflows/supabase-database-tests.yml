name: Supabase database tests

on:
  pull_request:
    branches: [main, work/mother-two-updated-mavis-20261110]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database-tests.yml"
  push:
    branches:
      - feature/mavis-cms-inventory-preview-20261114
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database-tests.yml"

permissions:
  contents: read

concurrency:
  group: supabase-db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Run PostgreSQL and RLS tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
