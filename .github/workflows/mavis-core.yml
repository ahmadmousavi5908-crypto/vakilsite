name: MAVIS Core Tests

on:
  push:
    branches:
      - feature/mavis-core-foundation
    paths:
      - "src/lib/mavis/**"
      - "tests/mavis/**"
      - ".github/workflows/mavis-core.yml"
  pull_request:
    paths:
      - "src/lib/mavis/**"
      - "tests/mavis/**"
      - ".github/workflows/mavis-core.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run MAVIS core tests
        run: npm run test:mavis-core
