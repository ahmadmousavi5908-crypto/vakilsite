name: Site quality checks

on:
  pull_request:
    branches: [main, work/mother-two-updated-mavis-20261110]
  push:
    branches:
      - main
      - redesign/persian-ux-typography
      - feat/legal-library-discovery-20261102
      - integration/mavis-knowledge-retrieval-mother-two-20261110
      - feat/mavis-editorial-cms-rebased-20261116

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://vakilsite-ci.example
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-4W4H01THN5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and synchronize lockfile
        run: npm ci --no-audit --no-fund
      - name: Install pinned Cloudflare runtime adapter for binding-aware build
        run: >-
          npm install --no-save --package-lock=false --no-audit --no-fund
          @opennextjs/cloudflare@1.20.17
          wrangler@4.161.0
      - name: Test canonical site URL and sitemap invariants
        run: npm run test:site-url
      - name: Test static sitemap image and recrawl signals
        run: node --test tests/seo/static-page-search-signals.test.mjs
      - name: Test Google Analytics measurement and lead tracking configuration
        run: node --test tests/seo/google-analytics.test.mjs
      - name: Test AI crawler metadata, llms.txt and privacy-safe service schema
        run: npm run test:seo-ai-readiness
      - name: Test IndexNow key and URL validation
        run: npm run test:indexnow
      - name: Test IndexNow publication notification client
        run: node --test tests/mavis/indexnow-client.test.mjs
      - name: Validate legal research dataset
        run: python3 src/data/legal-library/validation/validate_library.py
      - name: Validate legal library SEO data
        run: npm run validate:legal-library-seo
      - name: Test attorney profile structured data
        run: node --test tests/seo/attorney-profile-schema.test.mjs
      - name: Test breadcrumb structured data
        run: node --test tests/seo/breadcrumb-schema.test.mjs
      - name: Test article author entity mapping
        run: node --test tests/seo/article-author-schema.test.mjs
      - name: Test contextual article to service links
        run: node --test tests/seo/article-related-practice-area.test.mjs
      - name: Test practice area search titles
        run: node --test tests/seo/practice-area-search-titles.test.mjs
      - name: Test service-page keyword intent coverage
        run: node --test tests/seo/practice-area-keyword-content.test.mjs
      - name: Test services hub search title
        run: node --test tests/seo/services-hub-title.test.mjs
      - name: Generate offline published-article bundle
        run: node scripts/mavis/generate-offline-published-articles.mjs
      - name: Validate MAVIS offline knowledge bundle
        run: npm run validate:mavis-offline
      - name: Run MAVIS offline tests
        run: npm run test:mavis-offline
      - name: Run MAVIS offline intake tests
        run: node --test tests/mavis/offline-intake.test.mjs
      - name: Run MAVIS Search Console tests
        run: npm run test:mavis-search-console
      - name: Run Iranian legal source search tests
        run: npm run test:mavis-iranian-source-search
      - name: Run MAVIS editorial core tests
        run: npm run test:mavis-editorial-core
      - name: Test article search metadata overrides
        run: node --test tests/mavis/article-search-metadata.test.mjs
      - name: Test MAVIS keyword library
        run: node --test tests/mavis/keyword-library.test.mjs
      - name: Enforce SEO keyword governance and operating rules
        run: npm run validate:seo-governance
      - name: Run MAVIS editorial AI provider tests
        run: node --test tests/mavis/editorial-ai.test.mjs
      - name: Validate isolated Cloudflare Worker configurations
        run: node scripts/mavis/validate-wrangler-configs.mjs
      - name: Syntax-check isolated Staging E2E script
        run: node --check scripts/mavis/staging-admin-e2e.mjs
      - name: Run MAVIS knowledge retrieval tests
        run: >-
          node --test
          tests/mavis/knowledge-search.test.mjs
          tests/mavis/knowledge-retrieval.test.mjs
          tests/mavis/knowledge-search-route.test.mjs
          tests/mavis/legal-evidence.test.mjs
          tests/mavis/legal-research-dossier.test.mjs
      - name: Test isolate-local cache behavior
        run: node --test tests/cache/in-memory-cache.test.mjs
      - name: Run ESLint
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Verify legal library HTTP routes
        run: |
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/vakilsite-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/robots.txt > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/vakilsite-next.log
            exit 1
          fi

          for route in / /articles; do
            headers="$(curl --silent --show-error --head --dump-header - --output /dev/null "http://127.0.0.1:3000$route")"
            echo "$route response cache headers:"
            printf '%s\n' "$headers" | grep -i '^cache-control:' || true
            if printf '%s\n' "$headers" | grep -Eiq '^cache-control:.*no-store'; then
              echo "$route unexpectedly disables browser history caching."
              exit 1
            fi
          done

          npm run test:legal-library-http
