name: Site quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - redesign/persian-ux-typography

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and synchronize lockfile
        run: npm install --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint
      - name: Build production site
        run: npm run build
