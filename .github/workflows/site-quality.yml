name: Site quality checks

on:
  pull_request:
    branches: [main, work/mother-two-updated-mavis-20261110, "feature/**"]
  push:
    branches:
      - main
      - redesign/persian-ux-typography
      - feat/legal-library-discovery-20261102
      - integration/mavis-knowledge-retrieval-mother-two-20261110
      - "feature/**"

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://vakilsite-ci.example
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Protect approved public UI baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" --depth=1
          node scripts/mavis/verify-public-ui-boundary.mjs "$BASE_SHA" "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and synchronize lockfile
        run: npm ci --no-audit --no-fund
      - name: Test canonical site URL and sitemap invariants
        run: npm run test:site-url
      - name: Test IndexNow key and URL validation
        run: npm run test:indexnow
      - name: Validate legal research dataset
        run: python3 src/data/legal-library/validation/validate_library.py
      - name: Validate legal library SEO data
        run: npm run validate:legal-library-seo
      - name: Generate offline published-article bundle
        run: node scripts/mavis/generate-offline-published-articles.mjs
      - name: Validate MAVIS offline knowledge bundle
        run: npm run validate:mavis-offline
      - name: Run MAVIS offline tests
        run: npm run test:mavis-offline
      - name: Run MAVIS offline intake tests
        run: node --test tests/mavis/offline-intake.test.mjs
      - name: Run MAVIS admin authorization tests
        run: node --test tests/mavis/admin-auth.test.mjs
      - name: Run MAVIS article draft input tests
        run: node --test tests/mavis/article-draft-input.test.mjs
      - name: Run MAVIS editorial cursor tests
        run: node --test tests/mavis/editorial-cursor.test.mjs

      - name: Run MAVIS orchestrator policy tests
        run: node --test tests/mavis/orchestrator-policy.test.mjs

      - name: Run MAVIS evidence ranking tests
        run: node --test tests/mavis/evidence-ranker.test.mjs
      - name: Run MAVIS Search Console tests
        run: npm run test:mavis-search-console
      - name: Run MAVIS knowledge retrieval tests
        run: >-
          node --test
          tests/mavis/knowledge-search.test.mjs
          tests/mavis/knowledge-retrieval.test.mjs
          tests/mavis/knowledge-search-route.test.mjs
          tests/mavis/legal-evidence.test.mjs
          tests/mavis/legal-research-dossier.test.mjs
      - name: Run MAVIS source discovery adapter tests
        run: node --test tests/mavis/source-discovery-adapters.test.mjs
      - name: Run ESLint
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Verify legal library HTTP routes
        run: |
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/vakilsite-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/robots.txt > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/vakilsite-next.log
            exit 1
          fi

          npm run test:legal-library-http
