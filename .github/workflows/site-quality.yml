name: Site quality checks

on:
  pull_request:
    branches:
      - main
      - feature/mavis-core-foundation
      - feature/seo-aeo-geo-growth-system
      - feature/seo-technical-quality
  push:
    branches:
      - main
      - redesign/persian-ux-typography
      - feat/legal-library-discovery-20261102
      - feature/mavis-seo-integration-validation

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://vakilsite-ci.example
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and synchronize lockfile
        run: npm ci --no-audit --no-fund
      - name: Test canonical site URL and sitemap invariants
        run: npm run test:site-url
      - name: Run MAVIS core unit tests
        run: npm run test:mavis-core
      - name: Test IndexNow validation
        run: npm run test:indexnow
      - name: Validate legal research dataset
        run: python3 src/data/legal-library/validation/validate_library.py
      - name: Validate legal library SEO data
        run: npm run validate:legal-library-seo
      - name: Run ESLint
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Verify legal library HTTP routes
        run: |
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/vakilsite-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/robots.txt > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/vakilsite-next.log
            exit 1
          fi

          npm run test:legal-library-http
