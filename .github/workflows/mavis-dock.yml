name: MAVIS UI Regression

on:
  push:
    branches:
      - feature/mavis-character-dock
  pull_request:
    paths:
      - "src/components/mavis/**"
      - "src/app/layout.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mavis-dock.yml"

permissions:
  contents: read

concurrency:
  group: mavis-dock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
