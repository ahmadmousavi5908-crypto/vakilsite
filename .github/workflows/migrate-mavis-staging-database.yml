name: Migrate MAVIS staging database

on:
  push:
    branches:
      - main
      - feature/mavis-third-arm-delivery-20261116
    paths:
      - ".github/workflows/migrate-mavis-staging-database.yml"
      - "supabase/migrations/**"
      - "ops/mavis-staging-migration-019-apply.txt"
      - "ops/mavis-staging-migration-audit-trigger.txt"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply the reviewed migrations to vakilsite-staging (otherwise dry-run only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mavis-staging-database-migrations
  cancel-in-progress: false

jobs:
  migrate-staging:
    name: Review or apply staging database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: srbwniqhaxwaoepjfizf
    steps:
      - name: Check out the selected migration revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate staging-only target and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Configure SUPABASE_STAGING_ACCESS_TOKEN in the GitHub staging environment."
            exit 1
          fi
          if [ -z "${SUPABASE_STAGING_DB_URL:-}" ] && [ -z "${SUPABASE_STAGING_DB_PASSWORD:-}" ]; then
            echo "::error::Configure either SUPABASE_STAGING_DB_URL or SUPABASE_STAGING_DB_PASSWORD in the GitHub staging environment."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "srbwniqhaxwaoepjfizf" ] || [ "$SUPABASE_PROJECT_REF" = "jroflcmiczfwtmiaxmpd" ]; then
            echo "::error::Refusing to run migrations against any project except vakilsite-staging."
            exit 1
          fi
          if [ -n "${SUPABASE_STAGING_DB_URL:-}" ]; then
            node <<'NODE'
          const connection = new URL(process.env.SUPABASE_STAGING_DB_URL);
          const username = decodeURIComponent(connection.username);
          const validProtocol = connection.protocol === "postgres:" || connection.protocol === "postgresql:";
          const validPooler = connection.hostname.endsWith(".pooler.supabase.com") && connection.port === "5432";
          const validProject = username.endsWith(".srbwniqhaxwaoepjfizf") && !username.includes("jroflcmiczfwtmiaxmpd");
          const validDatabase = connection.pathname === "/postgres";
          if (!validProtocol || !validPooler || !validProject || !validDatabase) {
            throw new Error("Database URL is not a valid IPv4 session-pooler connection for vakilsite-staging.");
          }
          NODE
          fi
          echo "Target locked to vakilsite-staging via its IPv4 session pooler."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify Supabase CLI v3
        run: npx --yes supabase@3.0.0 --version

      - name: Authenticate and inspect migration history (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_STAGING_DB_URL:-}" ]; then
            echo "Checking the configured staging URI with a read-only migration-history query."
            if npx --yes supabase@3.0.0 migration list --remote="$SUPABASE_STAGING_DB_URL"; then
              echo "::add-mask::$SUPABASE_STAGING_DB_URL"
              echo "STAGING_DATABASE_URL=$SUPABASE_STAGING_DB_URL" >> "$GITHUB_ENV"
              echo "Read-only migration-history query succeeded with SUPABASE_STAGING_DB_URL."
              exit 0
            fi
            echo "The URI query failed; trying the dedicated password secret."
          fi
          if [ -n "${SUPABASE_STAGING_DB_PASSWORD:-}" ]; then
            STAGING_PASSWORD_URL="$(node -e 'const u = new URL("postgresql://postgres.srbwniqhaxwaoepjfizf@aws-1-eu-central-1.pooler.supabase.com:5432/postgres"); u.password = process.env.SUPABASE_STAGING_DB_PASSWORD; process.stdout.write(u.toString())')"
            echo "::add-mask::$STAGING_PASSWORD_URL"
            if npx --yes supabase@3.0.0 migration list --remote="$STAGING_PASSWORD_URL"; then
              echo "STAGING_DATABASE_URL=$STAGING_PASSWORD_URL" >> "$GITHUB_ENV"
              echo "Read-only migration-history query succeeded with SUPABASE_STAGING_DB_PASSWORD."
              exit 0
            fi
          fi
          echo "::error::Neither configured credential completed the read-only migration-history query. Review the connection error above; no migration was applied."
          exit 1

      - name: Verify local SQL files match the applied Staging migration history
        shell: bash
        run: |
          set -euo pipefail
          TEMP_WORKDIR="$(mktemp -d)"
          npx --yes supabase@3.0.0 --workdir "$TEMP_WORKDIR" init --force
          npx --yes supabase@3.0.0 --workdir "$TEMP_WORKDIR" migration fetch --remote="$STAGING_DATABASE_URL"
          REMOTE_DIR="$TEMP_WORKDIR/supabase/migrations"
          mapfile -t REMOTE_FILES < <(find "$REMOTE_DIR" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          mapfile -t LOCAL_FILES < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [ "${#REMOTE_FILES[@]}" -gt "${#LOCAL_FILES[@]}" ]; then
            echo "::error::Remote migration history contains versions missing from the selected local revision."
            printf 'Remote files: %s\n' "${REMOTE_FILES[*]}"
            printf 'Local files: %s\n' "${LOCAL_FILES[*]}"
            exit 1
          fi
          node - "$REMOTE_DIR" "supabase/migrations" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          function normalizeSql(source) {
            let output = "";
            let index = 0;
            let state = "normal";
            let blockDepth = 0;
            let dollarTag = "";

            const addSpace = () => {
              if (output && !output.endsWith(" ")) output += " ";
            };

            while (index < source.length) {
              const current = source[index];
              const next = source[index + 1];

              if (state === "normal") {
                if (current === "-" && next === "-") {
                  index += 2;
                  while (index < source.length && source[index] !== "\n" && source[index] !== "\r") index++;
                  addSpace();
                  continue;
                }
                if (current === "/" && next === "*") {
                  state = "block";
                  blockDepth = 1;
                  index += 2;
                  addSpace();
                  continue;
                }
                if (current === "'") {
                  output += current;
                  state = "single";
                  index++;
                  continue;
                }
                if (current === '"') {
                  output += current;
                  state = "double";
                  index++;
                  continue;
                }
                if (current === "$") {
                  const match = source.slice(index).match(/^\$[A-Za-z_][A-Za-z0-9_]*\$|^\$\$/);
                  if (match) {
                    dollarTag = match[0];
                    output += dollarTag;
                    state = "dollar";
                    index += dollarTag.length;
                    continue;
                  }
                }
                if (/\s/.test(current)) {
                  addSpace();
                  index++;
                  continue;
                }
                if (current === ";") {
                  output = output.trimEnd() + ";";
                  index++;
                  while (index < source.length && /\s/.test(source[index])) index++;
                  continue;
                }
                output += current;
                index++;
                continue;
              }

              if (state === "single") {
                output += current;
                index++;
                if (current === "'" && next === "'") {
                  output += next;
                  index++;
                } else if (current === "'" ) {
                  state = "normal";
                } else if (current === "\\" && index < source.length) {
                  output += source[index++];
                }
                continue;
              }

              if (state === "double") {
                output += current;
                index++;
                if (current === '"' && next === '"') {
                  output += next;
                  index++;
                } else if (current === '"') {
                  state = "normal";
                }
                continue;
              }

              if (state === "dollar") {
                if (source.startsWith(dollarTag, index)) {
                  output += dollarTag;
                  index += dollarTag.length;
                  state = "normal";
                } else {
                  output += current;
                  index++;
                }
                continue;
              }

              if (state === "block") {
                if (current === "/" && next === "*") {
                  blockDepth++;
                  index += 2;
                } else if (current === "*" && next === "/") {
                  blockDepth--;
                  index += 2;
                  if (blockDepth === 0) state = "normal";
                } else {
                  index++;
                }
              }
            }

            return output.trim();
          }

          const remoteDirectory = process.argv[2];
          const localDirectory = process.argv[3];
          const remoteFiles = fs.readdirSync(remoteDirectory).filter((name) => name.endsWith(".sql")).sort();
          const localFiles = fs.readdirSync(localDirectory).filter((name) => name.endsWith(".sql")).sort();

          const missingRemoteFiles = remoteFiles.filter((name) => !localFiles.includes(name));
          if (missingRemoteFiles.length > 0) {
            console.error("Remote migration history contains files missing from the selected local revision.");
            console.error(JSON.stringify({ missingRemoteFiles, remoteFiles, localFiles }, null, 2));
            process.exit(1);
          }

          const pendingFiles = localFiles.filter((name) => !remoteFiles.includes(name));
          console.log("Remote history contains " + remoteFiles.length + " applied migrations; selected revision contains " + localFiles.length + " migration files.");
          if (pendingFiles.length > 0) {
            console.log("Pending local migrations (not yet applied): " + pendingFiles.join(", "));
          }

          for (const name of remoteFiles) {
            const remoteSql = normalizeSql(fs.readFileSync(path.join(remoteDirectory, name), "utf8"));
            const localSql = normalizeSql(fs.readFileSync(path.join(localDirectory, name), "utf8"));
            if (remoteSql !== localSql) {
              console.error(`SQL statements differ from the applied Staging history: ${name}`);
              process.exit(1);
            }
          }

          console.log(`All ${remoteFiles.length} migration files match the applied Staging SQL after comment and whitespace normalization.`);
          NODE

      - name: Preview pending migrations (dry-run only)
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes supabase@3.0.0 db push --dry-run --remote="$STAGING_DATABASE_URL"; then
            echo "::error::Database access succeeded, but the migration preview failed. Compare the Local and Remote migration versions above; no migration was applied."
            exit 1
          fi

      - name: Apply migrations to staging only
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/mavis-third-arm-delivery-20261116' && github.event.head_commit.message == 'apply approved MAVIS staging migration 019') }}
        run: >-
          npx --yes supabase@3.0.0 db push
          --yes
          --remote="$STAGING_DATABASE_URL"

      - name: Verify remote migration history
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/mavis-third-arm-delivery-20261116' && github.event.head_commit.message == 'apply approved MAVIS staging migration 019') }}
        run: >-
          npx --yes supabase@3.0.0 migration list
          --remote="$STAGING_DATABASE_URL"
