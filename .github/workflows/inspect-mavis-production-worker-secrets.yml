name: Inspect MAVIS Production Worker integrations

on:
  push:
    branches:
      - main
    paths:
      - "ops/mavis-production-worker-inspection-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavis-production-worker-readonly-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only Production Worker secret inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Inspect Production Worker secret names only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Required deployment credential is missing: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx --yes wrangler@4.161.0 secret list --config wrangler.jsonc --name vakilahmadmousavi-ir --format json > "$RUNNER_TEMP/mavis-production-worker-secrets.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const entries = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/mavis-production-worker-secrets.json", "utf8"));
          const names = new Set(entries.map((entry) => entry.name));
          const groups = {
            "Google Search Console OAuth (live)": ["MAVIS_GSC_CLIENT_ID", "MAVIS_GSC_CLIENT_SECRET", "MAVIS_GSC_TOKEN_ENCRYPTION_KEY", "MAVIS_GSC_SITE_URL"]
          };
          for (const [label, required] of Object.entries(groups)) {
            const present = required.filter((name) => names.has(name));
            const status = present.length === required.length ? "CONFIGURED" : "MISSING";
            console.log(`${status}: ${label} (${present.length}/${required.length} required secrets present)`);
          }
          console.log(`${names.has("MAVIS_IRAN_SOURCE_SEARCH_API_KEY") ? "CONFIGURED" : "OPTIONAL_MISSING"}: Optional external Iranian search API key (Browser Run fallback available)`);
          console.log(`${names.has("MAVIS_GSC_REFRESH_TOKEN") ? "CONFIGURED" : "OPTIONAL_MISSING"}: Optional static GSC refresh-token fallback (OAuth stores encrypted tokens in Supabase)`);
          console.log("Search Console CSV fallback: LOCAL_ONLY (browser-side import available; OAuth is required only for live API access).");
          const wrangler = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const workersAiReady = wrangler.ai?.binding === "AI";
          console.log(`${workersAiReady ? "DECLARED_IN_CONFIG" : "MISSING"}: Editorial AI Workers AI binding (${workersAiReady ? "AI" : "not configured"})`);
          const browserRunReady = wrangler.browser?.binding === "BROWSER";
          console.log(`${browserRunReady ? "DECLARED_IN_CONFIG" : "MISSING"}: Official-source Browser Run binding (${browserRunReady ? "BROWSER" : "not configured"})`);
          console.log(`${names.has("MAVIS_OPENAI_API_KEY") ? "CONFIGURED" : "OPTIONAL_MISSING"}: OpenAI fallback key`);
          console.log("Local growth audit: LOCAL_ONLY (no external competitor-search secret is required).");
          console.log("Secret values were never requested, read, or printed.");
          NODE
