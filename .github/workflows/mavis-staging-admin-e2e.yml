name: MAVIS authenticated Staging editorial E2E

on:
  push:
    branches:
      - feature/mavis-indexnow-publication-notify-20261114
    paths:
      - "ops/mavis-staging-admin-e2e-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavis-staging-authenticated-editorial-e2e
  cancel-in-progress: false

jobs:
  editorial-e2e:
    name: Test authenticated draft-to-publication lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
      SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out reviewed Staging revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Supabase CLI
        run: npx --yes supabase@3.0.0 --version

      - name: Resolve protected Staging Auth admin key
        if: env.SUPABASE_STAGING_SERVICE_ROLE_KEY == ''
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/srbwniqhaxwaoepjfizf/api-keys?reveal=true")"
          key="$(jq -r '([.[] | select(.type == "legacy" and .name == "service_role") | .api_key] + [.[] | select(.type == "secret") | .api_key] | map(select(type == "string" and length > 20)) | .[0]) // empty' <<< "$response")"
          if [[ -z "$key" ]]; then
            echo "::error::Could not resolve a Staging service-role/secret API key. The Staging Supabase access token needs API Keys read and API Key Secrets read permissions."
            exit 1
          fi
          echo "::add-mask::$key"
          printf 'SUPABASE_STAGING_SERVICE_ROLE_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          unset response key

      - name: Run authenticated Staging editorial lifecycle
        run: node scripts/mavis/staging-admin-e2e.mjs
