name: MAVIS authenticated Staging editorial E2E

on:
  push:
    branches:
      - main
      - feature/mavis-third-arm-delivery-20261116
      - feature/mavis-article-images-active-editor
    paths:
      - "ops/mavis-staging-admin-e2e-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavis-staging-authenticated-editorial-e2e
  cancel-in-progress: false

jobs:
  editorial-e2e:
    name: Test authenticated draft-to-publication lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_SITE_URL: https://staging.vakilahmadmousavi.ir
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - name: Check out reviewed Staging revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Supabase CLI
        run: npx --yes supabase@3.0.0 --version

      - name: Run authenticated Staging editorial lifecycle
        run: node scripts/mavis/staging-admin-e2e.mjs
