name: MAVIS database security tests

on:
  push:
    branches:
      - main
      - integration/mavis-release-gate-20261109
      - test/mavis-local-backup-restore-20261109
  pull_request:
    branches:
      - main
      - integration/mavis-mvp-candidate-20261108
      - integration/mother-two-research-only-20261106
      - security/restrict-social-links-grants-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database_changed: ${{ steps.filter.outputs.database_changed }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect database-affecting changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "database_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "database_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/mavis-changed-files.txt; then
            echo "Unable to calculate the change set; running database checks fail-safe."
            echo "database_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Eq '^(supabase/|scripts/mavis/verify-local-backup-restore\.sh$)' /tmp/mavis-changed-files.txt; then
            echo "database_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "database_changed=false" >> "$GITHUB_OUTPUT"
          fi

  database:
    needs: changes
    if: needs.changes.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: mavis-database-tests-${{ github.repository }}
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        id: setup_supabase_cli
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Generate isolated local Supabase config
        run: |
          mkdir -p /tmp/mavis-supabase-bootstrap
          cd /tmp/mavis-supabase-bootstrap
          supabase init
          cp supabase/config.toml "$GITHUB_WORKSPACE/supabase/config.toml"

      - name: Start isolated local Supabase stack
        run: |
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if supabase start -x imgproxy,logflare,vector,mailpit > /tmp/mavis-supabase-start.log 2>&1; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -lt 3 ] && grep -Eqi 'rate exceeded|port is already allocated|address already in use|connection reset|unexpected EOF' /tmp/mavis-supabase-start.log; then
              echo "Supabase startup hit a transient registry/port condition; cleaning partial stack and retrying."
              timeout 60s supabase stop >/dev/null 2>&1 || true
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
              continue
            fi

            awk 'tolower($0) ~ /(key|secret|token|jwt|sb_)/ { print "[REDACTED: sensitive startup output]"; next } { print }' /tmp/mavis-supabase-start.log
            exit "$status"
          done

          awk 'tolower($0) ~ /(key|secret|token|jwt|sb_)/ { print "[REDACTED: sensitive startup output]"; next } { print }' /tmp/mavis-supabase-start.log
          exit 1

      - name: Install PostgreSQL client for restore verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply migrations and run pgTAP security tests
        run: supabase test db

      - name: Verify synthetic local database backup and restore
        run: bash scripts/mavis/verify-local-backup-restore.sh

      - name: Stop local Supabase stacks and clean temporary backup files
        if: always() && steps.setup_supabase_cli.outcome == 'success'
        run: |
          RESTORE_DIR="$RUNNER_TEMP/mavis-backup-restore-$GITHUB_RUN_ID/restore-project"
          if [ -f "$RESTORE_DIR/supabase/config.toml" ]; then
            (cd "$RESTORE_DIR" && timeout 60s supabase stop) || true
          fi
          timeout 60s supabase stop || true
          rm -rf "$RUNNER_TEMP/mavis-backup-restore-$GITHUB_RUN_ID"
