name: MAVIS database security tests

on:
  push:
    branches:
      - security/restrict-social-links-grants-20261108
      - integration/mavis-mvp-candidate-20261108
      - integration/mavis-release-gate-20261109
  pull_request:
    branches:
      - integration/mavis-mvp-candidate-20261108
      - integration/mother-two-research-only-20261106
      - security/restrict-social-links-grants-20261108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavis-database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        id: setup_supabase_cli
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Generate isolated local Supabase config
        run: |
          mkdir -p /tmp/mavis-supabase-bootstrap
          cd /tmp/mavis-supabase-bootstrap
          supabase init
          cp supabase/config.toml "$GITHUB_WORKSPACE/supabase/config.toml"

      - name: Start isolated local Supabase stack
        run: |
          if ! supabase start -x imgproxy,logflare,vector,mailpit > /tmp/mavis-supabase-start.log 2>&1; then
            awk 'tolower($0) ~ /(key|secret|token|jwt|sb_)/ { print "[REDACTED: sensitive startup output]"; next } { print }' /tmp/mavis-supabase-start.log
            exit 1
          fi

      - name: Apply migrations and run pgTAP security tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always() && steps.setup_supabase_cli.outcome == 'success'
        run: supabase stop
