name: One-time MAVIS hero image optimization

on:
  push:
    branches:
      - perf/mavis-offline-startup
    paths:
      - ".github/workflows/optimize-mavis-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/mavis-offline-startup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned image processor
        run: npm install --no-save --package-lock=false sharp@0.35.5
      - name: Convert MAVIS hero to responsive WebP
        run: |
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          const input = "public/mavis-offline/mavis-welcome-hero.png";
          const output = "public/mavis-offline/mavis-welcome-hero.webp";
          const info = await sharp(input)
            .resize({ width: 780, withoutEnlargement: true })
            .webp({ quality: 84, alphaQuality: 100, effort: 6 })
            .toFile(output);
          console.log(JSON.stringify({
            inputBytes: (await import("node:fs/promises")).stat(input).then(x => x.size),
            outputBytes: info.size,
            width: info.width,
            height: info.height,
            format: info.format
          }));
          NODE
      - name: Commit optimized asset to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mavis-offline/mavis-welcome-hero.webp
          git commit -m "perf(mavis): add optimized WebP welcome image"
          git push origin HEAD:perf/mavis-offline-startup
