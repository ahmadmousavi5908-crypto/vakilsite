name: Deploy MAVIS editorial staging

on:
  push:
    branches:
      - feature/mavis-indexnow-publication-notify-20261114
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "wrangler.staging.jsonc"
      - ".github/workflows/deploy-mavis-editorial-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavis-editorial-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Build and deploy isolated staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out selected Staging revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate isolated Staging configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Staging environment value: $name"
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("wrangler.staging.jsonc", "utf8"));
          const site = new URL(process.env.NEXT_PUBLIC_SITE_URL);
          const supabase = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL);
          if (
            config.name !== "vakilahmadmousavi-ir-staging" ||
            config.workers_dev !== true ||
            config.routes ||
            config.account_id
          ) {
            throw new Error("Staging Worker configuration is not isolated.");
          }
          if (
            site.protocol !== "https:" ||
            !site.hostname.startsWith("vakilahmadmousavi-ir-staging.") ||
            !site.hostname.endsWith(".workers.dev") ||
            site.pathname !== "/" ||
            site.search ||
            site.hash ||
            site.hostname === "vakilahmadmousavi.ir"
          ) {
            throw new Error("NEXT_PUBLIC_SITE_URL must be the dedicated Staging workers.dev origin.");
          }
          if (
            supabase.protocol !== "https:" ||
            supabase.hostname !== "srbwniqhaxwaoepjfizf.supabase.co" ||
            supabase.hostname === "jroflcmiczfwtmiaxmpd.supabase.co"
          ) {
            throw new Error("NEXT_PUBLIC_SUPABASE_URL must target only the Staging Supabase project.");
          }
          if (!process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY.trim()) {
            throw new Error("The Staging Supabase publishable key is missing.");
          }
          console.log("Staging Worker and Supabase isolation checks passed.");
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Cloudflare tooling
        run: >-
          npm install --no-save --package-lock=false --no-audit --no-fund
          @opennextjs/cloudflare@1.20.17
          wrangler@4.161.0

      - name: Build Staging Worker
        run: npx opennextjs-cloudflare build

      - name: Validate Staging Worker bundle without deploying
        run: >-
          npx wrangler deploy --dry-run --config wrangler.staging.jsonc
          --var "NEXT_PUBLIC_SITE_URL:${NEXT_PUBLIC_SITE_URL}"
          "NEXT_PUBLIC_SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL}"
          "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"

      - name: Deploy only the isolated Staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.staging.jsonc
          --var "NEXT_PUBLIC_SITE_URL:${NEXT_PUBLIC_SITE_URL}"
          "NEXT_PUBLIC_SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL}"
          "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
