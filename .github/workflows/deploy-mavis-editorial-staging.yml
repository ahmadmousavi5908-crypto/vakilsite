name: Deploy MAVIS editorial staging

on:
  push:
    branches:
      - main
    paths:
      - "ops/mavis-staging-deploy-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavis-editorial-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Build and deploy isolated staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out the selected deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate isolated staging configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing staging environment value: $name"
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          const site = new URL(process.env.NEXT_PUBLIC_SITE_URL);
          const supabase = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL);
          const stagingSupabaseHost = "srbwniqhaxwaoepjfizf.supabase.co";
          const productionSupabaseHost = "jroflcmiczfwtmiaxmpd";
          const isWorkersDev =
            site.hostname.startsWith("vakilahmadmousavi-ir-staging.") &&
            site.hostname.endsWith(".workers.dev");
          const isCustomStaging = site.hostname.startsWith("staging.");

          if (
            site.protocol !== "https:" ||
            site.username ||
            site.password ||
            site.pathname !== "/" ||
            site.search ||
            site.hash ||
            site.hostname === "vakilahmadmousavi.ir" ||
            (!isWorkersDev && !isCustomStaging)
          ) {
            throw new Error("NEXT_PUBLIC_SITE_URL must be a dedicated HTTPS staging origin.");
          }

          if (
            supabase.protocol !== "https:" ||
            supabase.username ||
            supabase.password ||
            supabase.pathname !== "/" ||
            supabase.search ||
            supabase.hash ||
            supabase.hostname !== stagingSupabaseHost ||
            supabase.hostname === productionSupabaseHost
          ) {
            throw new Error("NEXT_PUBLIC_SUPABASE_URL must point only to the dedicated vakilsite-staging project.");
          }

          if (!process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY.trim()) {
            throw new Error("The staging Supabase publishable key is missing.");
          }

          console.log("Dedicated Staging Worker and Supabase origins passed validation.");
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Cloudflare adapter tooling
        run: >-
          npm install --no-save --package-lock=false --no-audit --no-fund
          @opennextjs/cloudflare@1.20.17
          wrangler@4.161.0

      - name: Build staging Worker
        run: npx opennextjs-cloudflare build

      - name: Prepare optional MAVIS runtime secrets
        env:
          MAVIS_OPENAI_API_KEY: ${{ secrets.MAVIS_OPENAI_API_KEY }}
          MAVIS_IRAN_SOURCE_SEARCH_API_KEY: ${{ secrets.MAVIS_IRAN_SOURCE_SEARCH_API_KEY }}
          MAVIS_GSC_CLIENT_ID: ${{ secrets.MAVIS_GSC_CLIENT_ID }}
          MAVIS_GSC_CLIENT_SECRET: ${{ secrets.MAVIS_GSC_CLIENT_SECRET }}
          MAVIS_GSC_TOKEN_ENCRYPTION_KEY: ${{ secrets.MAVIS_GSC_TOKEN_ENCRYPTION_KEY }}
          MAVIS_GSC_SITE_URL: ${{ secrets.MAVIS_GSC_SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const names = [
            "MAVIS_OPENAI_API_KEY",
            "MAVIS_IRAN_SOURCE_SEARCH_API_KEY",
            "MAVIS_GSC_CLIENT_ID",
            "MAVIS_GSC_CLIENT_SECRET",
            "MAVIS_GSC_TOKEN_ENCRYPTION_KEY",
            "MAVIS_GSC_SITE_URL",
          ];
          const gscNames = names.filter((name) => name.startsWith("MAVIS_GSC_"));
          const configuredGsc = gscNames.filter((name) => Boolean(process.env[name]?.trim()));
          if (configuredGsc.length > 0 && configuredGsc.length !== gscNames.length) {
            const missing = gscNames.filter((name) => !process.env[name]?.trim());
            throw new Error("Google Search Console credentials must be configured together: " + missing.join(", "));
          }

          const secrets = Object.fromEntries(
            names
              .filter((name) => typeof process.env[name] === "string" && process.env[name].trim())
              .map((name) => [name, process.env[name]])
          );
          const file = path.join(process.env.RUNNER_TEMP, "mavis-staging-runtime-secrets.json");
          fs.writeFileSync(file, JSON.stringify(secrets), { mode: 0o600 });
          console.log(`Prepared ${Object.keys(secrets).length} optional MAVIS Staging runtime secrets without exposing their values.`);
          NODE

      - name: Deploy only the isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.staging.jsonc
          --var "NEXT_PUBLIC_SITE_URL:${NEXT_PUBLIC_SITE_URL}"
          --var "NEXT_PUBLIC_SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL}"
          --var "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
          --secrets-file "$RUNNER_TEMP/mavis-staging-runtime-secrets.json"
