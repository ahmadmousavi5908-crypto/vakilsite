name: MAVIS Staging smoke tests

on:
  push:
    branches:
      - feature/mavis-indexnow-publication-notify-20261114
    paths:
      - "ops/mavis-staging-smoke-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify live Staging Worker routes and access boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public Staging routes
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          routes=(/ /robots.txt /sitemap.xml /articles /articles/library /admin/login)
          for route in "${routes[@]}"; do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 -D /tmp/mavis-staging-headers -o /tmp/mavis-staging-body -w '%{http_code}' "$BASE_URL$route" || true)"
            echo "$route => HTTP $status"
            if [ "$status" != "200" ]; then
              echo "::error::Staging route failed: $route"
              cat /tmp/mavis-staging-headers 2>/dev/null || true
              cat /tmp/mavis-staging-body 2>/dev/null || true
              exit 1
            fi
          done
          curl --silent --show-error --fail --connect-timeout 5 --max-time 15 "$BASE_URL/sitemap.xml" -o /tmp/mavis-staging-sitemap.xml
          grep -Fq "$BASE_URL" /tmp/mavis-staging-sitemap.xml
          if grep -Fq "https://vakilahmadmousavi.ir" /tmp/mavis-staging-sitemap.xml; then
            echo "::error::Staging sitemap contains the Production canonical origin."
            exit 1
          fi

      - name: Inspect anonymous admin page response
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          status="$(curl --silent --show-error --max-time 20 -o /tmp/mavis-admin-body -D /tmp/mavis-admin-headers -w '%{http_code}' "$BASE_URL/admin/mavis/articles")"
          echo "/admin/mavis/articles => HTTP $status"
          case "$status" in
            301|302|303|307|308|401|403)
              echo "Anonymous request was rejected or redirected."
              ;;
            200)
              if grep -Fq "admin-shell" /tmp/mavis-admin-body; then
                echo "::error::Anonymous request rendered the admin shell."
                exit 1
              elif grep -Fq "admin-login-form" /tmp/mavis-admin-body; then
                echo "Anonymous request received the login form."
              else
                echo "HTTP 200 returned neither the admin shell nor the login form; inspecting the complete response."
                cat /tmp/mavis-admin-headers
                echo "Response bytes: $(wc -c < /tmp/mavis-admin-body)"
                echo "Recognized markers:"
                grep -Eo 'admin-shell|admin-login-form|دسترسی مدیر تأیید شده|MAVIS · CONTENT WORKSPACE|صف بازبینی|ورود به پنل مدیریت' /tmp/mavis-admin-body | sort | uniq -c || true
                echo "Body classes:"
                grep -Eo 'class="[^"]+"' /tmp/mavis-admin-body | sort -u | head -30 || true
                echo "Response tail:"
                tail -c 2500 /tmp/mavis-admin-body
              fi
              ;;
            *)
              echo "::error::Unexpected response from the admin route."
              cat /tmp/mavis-admin-headers
              head -c 2500 /tmp/mavis-admin-body
              exit 1
              ;;
          esac

      - name: Verify admin API rejects anonymous requests
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          status="$(curl --silent --show-error --max-time 20 -o /tmp/mavis-admin-api-body -D /tmp/mavis-admin-api-headers -w '%{http_code}' "$BASE_URL/api/admin/mavis/search-console/status")"
          echo "/api/admin/mavis/search-console/status => HTTP $status"
          if [ "$status" != "403" ]; then
            echo "::error::Anonymous admin API request must return HTTP 403."
            cat /tmp/mavis-admin-api-headers
            cat /tmp/mavis-admin-api-body
            exit 1
          fi

      - name: Verify Staging is not indexable
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          curl --silent --show-error --fail --max-time 20 "$BASE_URL/" -D /tmp/mavis-staging-headers -o /tmp/mavis-staging-home
          if ! grep -Eiq '^x-robots-tag:.*noindex' /tmp/mavis-staging-headers; then
            echo "::error::Staging homepage is missing an explicit noindex signal."
            exit 1
          fi
          echo "Staging noindex signal verified."
