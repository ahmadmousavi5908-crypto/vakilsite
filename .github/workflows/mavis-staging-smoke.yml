name: MAVIS Staging smoke tests

on:
  push:
    branches:
      - feature/mavis-indexnow-publication-notify-20261114
    paths:
      - "ops/mavis-staging-smoke-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify live Staging Worker routes and access boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public Staging routes
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          routes=(/ /robots.txt /sitemap.xml /articles /articles/library /admin/login)
          for route in "${routes[@]}"; do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 -D /tmp/mavis-staging-headers -o /tmp/mavis-staging-body -w '%{http_code}' "$BASE_URL$route" || true)"
            echo "$route => HTTP $status"
            if [ "$status" != "200" ]; then
              echo "::error::Staging route failed: $route"
              cat /tmp/mavis-staging-headers 2>/dev/null || true
              cat /tmp/mavis-staging-body 2>/dev/null || true
              exit 1
            fi
          done
          curl --silent --show-error --fail --connect-timeout 5 --max-time 15 "$BASE_URL/sitemap.xml" -o /tmp/mavis-staging-sitemap.xml
          grep -Fq "$BASE_URL" /tmp/mavis-staging-sitemap.xml
          if grep -Fq "https://vakilahmadmousavi.ir" /tmp/mavis-staging-sitemap.xml; then
            echo "::error::Staging sitemap contains the Production canonical origin."
            exit 1
          fi

      - name: Verify anonymous admin pages redirect to login
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          for route in /admin/mavis/articles /admin/mavis/growth; do
            status="$(curl --silent --show-error --max-time 20 -o /tmp/mavis-admin-body -D /tmp/mavis-admin-headers -w '%{http_code}' "$BASE_URL$route")"
            echo "$route => HTTP $status"
            case "$status" in
              301|302|303|307|308)
                if ! grep -Eiq '^location:.*/admin/login' /tmp/mavis-admin-headers; then
                  echo "::error::Anonymous admin redirect does not point to the login page: $route"
                  cat /tmp/mavis-admin-headers
                  exit 1
                fi
                ;;
              401|403) ;;
              *)
                echo "::error::Anonymous admin page must not render with HTTP $status: $route"
                exit 1
                ;;
            esac
          done

      - name: Verify admin API rejects anonymous requests
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          status="$(curl --silent --show-error --max-time 20 -o /tmp/mavis-admin-api-body -D /tmp/mavis-admin-api-headers -w '%{http_code}' "$BASE_URL/api/admin/mavis/search-console/status")"
          echo "/api/admin/mavis/search-console/status => HTTP $status"
          if [ "$status" != "403" ]; then
            echo "::error::Anonymous admin API request must return HTTP 403."
            cat /tmp/mavis-admin-api-headers
            cat /tmp/mavis-admin-api-body
            exit 1
          fi

      - name: Verify Iranian source search API rejects anonymous POST requests
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          status="$(curl --silent --show-error --max-time 20 -X POST -H 'content-type: application/json' -d '{"query":"قانون مدنی"}' -o /tmp/mavis-source-search-body -D /tmp/mavis-source-search-headers -w '%{http_code}' "$BASE_URL/api/admin/mavis/source-search")"
          echo "/api/admin/mavis/source-search => HTTP $status"
          if [ "$status" != "401" ]; then
            echo "::error::Anonymous Iranian source search must return HTTP 401."
            cat /tmp/mavis-source-search-headers
            cat /tmp/mavis-source-search-body
            exit 1
          fi

      - name: Verify retired editorial route remains behind administrator authentication
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          status="$(curl --silent --show-error --max-time 20 -o /tmp/mavis-legacy-editorial-body -D /tmp/mavis-legacy-editorial-headers -w '%{http_code}' "$BASE_URL/admin/mavis/editorial")"
          echo "/admin/mavis/editorial => HTTP $status"
          case "$status" in
            307|308)
              if grep -Eiq '^location: */admin/login' /tmp/mavis-legacy-editorial-headers; then
                echo "PASS: anonymous access is stopped by the admin middleware before the authenticated compatibility redirect."
              elif grep -Eiq '^location: */admin/mavis/articles' /tmp/mavis-legacy-editorial-headers; then
                echo "PASS: legacy editorial route redirects to the versioned CMS."
              else
                echo "::error::Legacy editorial route redirected to an unexpected destination."
                cat /tmp/mavis-legacy-editorial-headers
                exit 1
              fi
              ;;
            401|403)
              echo "PASS: legacy editorial route rejects anonymous access."
              ;;
            *)
              echo "::error::Legacy editorial route must remain protected by administrator authentication."
              cat /tmp/mavis-legacy-editorial-headers
              exit 1
              ;;
          esac

      - name: Verify competitor research API rejects anonymous POST requests
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          status="$(curl --silent --show-error --max-time 20 -X POST -H 'content-type: application/json' -d '{"query":"وکیل اهواز"}' -o /tmp/mavis-competitor-api-body -D /tmp/mavis-competitor-api-headers -w '%{http_code}' "$BASE_URL/api/admin/mavis/growth/competitors")"
          echo "/api/admin/mavis/growth/competitors => HTTP $status"
          if [ "$status" != "401" ]; then
            echo "::error::Anonymous competitor research API must return HTTP 401."
            cat /tmp/mavis-competitor-api-headers
            cat /tmp/mavis-competitor-api-body
            exit 1
          fi

      - name: Verify Staging is not indexable
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://vakilahmadmousavi-ir-staging.ahmadmousavi5908.workers.dev"
          curl --silent --show-error --fail --max-time 20 "$BASE_URL/" -D /tmp/mavis-staging-headers -o /tmp/mavis-staging-home
          if ! grep -Eiq '^x-robots-tag:.*noindex' /tmp/mavis-staging-headers; then
            echo "::error::Staging homepage is missing an explicit noindex signal."
            exit 1
          fi
          echo "Staging noindex signal verified."


  scholarly-providers:
    name: Verify live scholarly source discovery providers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source adapters
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test live Crossref, Semantic Scholar and OpenAlex metadata search
        run: |
          node --input-type=module <<'NODE'
          import { createMavisSourceDiscoveryAdapters } from "./src/lib/mavis/source-discovery-adapters.mjs";
          const adapters = createMavisSourceDiscoveryAdapters({ timeoutMs: 7000 });
          const providers = [
            ["Crossref", adapters.searchCrossref],
            ["Semantic Scholar", adapters.searchSemanticScholar],
            ["OpenAlex", adapters.searchOpenAlex],
          ];
          const results = [];
          for (const [name, search] of providers) {
            const result = await search("Iranian contract law civil liability", 3);
            const valid = result.ok === true && Array.isArray(result.candidates) &&
              result.candidates.every((item) => typeof item.title === "string" &&
                typeof item.sourceUrl === "string" && item.sourceUrl.startsWith("https://"));
            console.log(`${valid ? "PASS" : "FAIL"}: ${name} live metadata request; candidates=${result.candidates?.length ?? 0}; error=${result.error || "none"}`);
            results.push({ name, valid });
          }
          const successful = results.filter((item) => item.valid).length;
          if (!results[0].valid || successful < 2) {
            throw new Error(`Live scholarly source discovery verification failed: ${successful}/3 providers passed; Crossref must pass.`);
          }
          console.log(`PASS: ${successful}/3 live scholarly metadata providers returned normalized HTTPS records.`);
          NODE
