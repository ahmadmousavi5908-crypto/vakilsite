name: Read-only MAVIS Production publication audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-mavis-production-publication.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavis-production-publication-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Probe Production publication schema and public routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_PRODUCTION_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Probe Supabase Production read and RPC surface
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          readarray -t SUPABASE_CONFIG < <(node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
            console.log(config.vars.NEXT_PUBLIC_SUPABASE_URL);
            console.log(config.vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY);
          ')
          SUPABASE_URL="${SUPABASE_CONFIG[0]}"
          SUPABASE_PUBLISHABLE_KEY="${SUPABASE_CONFIG[1]}"

          request() {
            local label="$1"
            local method="$2"
            local endpoint="$3"
            local output="$4"
            local payload="${5:-}"
            local status

            if [ "$method" = "POST" ]; then
              status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --request POST \
                --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
                --header "Content-Type: application/json" \
                --data "$payload" \
                --output "$output" --write-out '%{http_code}' \
                "$SUPABASE_URL/rest/v1/rpc/$endpoint" || true)"
            else
              status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
                --output "$output" --write-out '%{http_code}' \
                "$SUPABASE_URL/rest/v1/$endpoint" || true)"
            fi

            node - "$label" "$status" "$output" <<'NODE'
          const fs = require("node:fs");
          const [label, status, file] = process.argv.slice(2);
          let body = "";
          try { body = fs.readFileSync(file, "utf8"); } catch {}
          let parsed;
          try { parsed = JSON.parse(body); } catch {}
          const code = parsed && !Array.isArray(parsed) ? parsed.code : undefined;
          const message = parsed && !Array.isArray(parsed) ? String(parsed.message || "").slice(0, 180) : "";
          console.log(label + ": HTTP " + status + (code ? " | code=" + code : "") + (message ? " | " + message : ""));
          if (label === "get_mavis_published_articles" && status === "200") {
            if (!Array.isArray(parsed)) {
              console.error("Published-article RPC returned a non-array payload.");
              process.exitCode = 1;
            } else {
              console.log("published_article_count=" + parsed.length);
              console.log("published_slugs=" + parsed.slice(0, 20).map((row) => row.slug).filter(Boolean).join(","));
            }
          }
          NODE
          }

          request "get_mavis_published_articles" "GET" "rpc/get_mavis_published_articles" "$WORKDIR/published.json"
          request "publish_mavis_article_guard_probe" "POST" "publish_mavis_article" "$WORKDIR/publish.json" '{"p_article_id":null,"p_expected_version":null}'
          request "unpublish_mavis_article_guard_probe" "POST" "unpublish_mavis_article" "$WORKDIR/unpublish.json" '{"p_article_id":null,"p_expected_version":null}'
          request "public_mavis_articles_view" "GET" "mavis_articles?select=slug&status=eq.published&limit=100" "$WORKDIR/view.json"

      - name: Read-only Supabase Management API database audit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PRODUCTION_ACCESS_TOKEN:-}" ]; then
            echo "Management API audit skipped: no SUPABASE_PRODUCTION_ACCESS_TOKEN is configured in the production environment."
            exit 0
          fi

          QUERY="$(cat <<'SQL'
          SELECT
            'relation' AS object_type,
            n.nspname || '.' || c.relname AS object_name,
            'kind=' || c.relkind
              || '; anon_select=' || has_table_privilege('anon', c.oid, 'SELECT')
              || '; authenticated_select=' || has_table_privilege('authenticated', c.oid, 'SELECT')
              || '; rls=' || c.relrowsecurity AS details
          FROM pg_catalog.pg_class c
          JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relname IN ('mavis_articles', 'mavis_editorial_articles')
          UNION ALL
          SELECT
            'function',
            p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')',
            'returns=' || pg_get_function_result(p.oid)
              || '; anon_execute=' || has_function_privilege('anon', p.oid, 'EXECUTE')
              || '; authenticated_execute=' || has_function_privilege('authenticated', p.oid, 'EXECUTE')
              || '; security_definer=' || p.prosecdef
          FROM pg_catalog.pg_proc p
          JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = 'public'
            AND p.proname IN ('get_mavis_published_articles', 'publish_mavis_article', 'unpublish_mavis_article')
          ORDER BY object_type, object_name;
          SQL
          )"
          export QUERY
          PAYLOAD="$(node -e 'process.stdout.write(JSON.stringify({ query: process.env.QUERY }))')"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT
          STATUS="$(curl --silent --show-error --connect-timeout 10 --max-time 45 \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_PRODUCTION_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --output "$BODY_FILE" --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/jroflcmiczfwtmiaxmpd/database/query/read-only" || true)"
          echo "Supabase Management API read-only schema query: HTTP $STATUS"
          node - "$BODY_FILE" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const raw = fs.readFileSync(file, "utf8");
          try {
            const value = JSON.parse(raw);
            console.log(JSON.stringify(value, null, 2).slice(0, 8000));
          } catch {
            console.log(raw.slice(0, 2000));
          }
          NODE

      - name: Probe public production pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /articles /articles/library; do
            status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' "https://vakilahmadmousavi.ir$path" || true)"
            printf '%s HTTP %s\n' "$path" "$status"
            if [ "$status" != "200" ]; then
              echo "::warning::Public route did not return HTTP 200: $path"
            fi
          done
