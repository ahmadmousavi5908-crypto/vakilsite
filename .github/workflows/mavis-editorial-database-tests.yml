name: MAVIS editorial database security tests

on:
  pull_request:
    branches:
      - work/mother-two-updated-mavis-20261110
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/mavis-editorial-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Run database and RLS tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
