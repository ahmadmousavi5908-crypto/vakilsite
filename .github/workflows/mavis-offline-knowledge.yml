name: MAVIS Offline Knowledge
on:
  pull_request:
    paths:
      - "public/mavis-offline/**"
      - "tests/mavis/offline-search.test.mjs"
      - ".github/workflows/mavis-offline-knowledge.yml"
  push:
    branches:
      - "feature/mavis-offline-first-public-knowledge-20261108"
    paths:
      - "public/mavis-offline/**"
      - "tests/mavis/offline-search.test.mjs"
      - ".github/workflows/mavis-offline-knowledge.yml"
permissions:
  contents: read
jobs:
  offline-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript syntax
        run: |
          node --check public/mavis-offline/app.js
          node --check public/mavis-offline/search.mjs
          node --check public/mavis-offline/sw.js
      - name: Validate offline knowledge bundle
        run: |
          node -e "const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync('public/mavis-offline/knowledge.json','utf8')); if(d.jurisdiction!=='IR'||d.language!=='fa-IR'||!Array.isArray(d.records)||d.records.length===0) process.exit(1); console.log(JSON.stringify(d.counts));"
      - name: Test deterministic Persian search
        run: node --test tests/mavis/offline-search.test.mjs
