name: Deploy Vakilsite to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vakilsite-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
          echo "All required deployment credentials are present."

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Cloudflare tooling
        run: >-
          npm install --no-save --package-lock=false --no-audit --no-fund
          @opennextjs/cloudflare@1.20.17
          wrangler@4.161.0

      - name: Build and deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://vakilahmadmousavi.ir
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-4W4H01THN5
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          MAVIS_OPENAI_API_KEY: ${{ secrets.MAVIS_OPENAI_API_KEY }}
          MAVIS_IRAN_SOURCE_SEARCH_API_KEY: ${{ secrets.MAVIS_IRAN_SOURCE_SEARCH_API_KEY }}
          MAVIS_GSC_CLIENT_ID: ${{ secrets.MAVIS_GSC_CLIENT_ID }}
          MAVIS_GSC_CLIENT_SECRET: ${{ secrets.MAVIS_GSC_CLIENT_SECRET }}
          MAVIS_GSC_TOKEN_ENCRYPTION_KEY: ${{ secrets.MAVIS_GSC_TOKEN_ENCRYPTION_KEY }}
          MAVIS_GSC_SITE_URL: ${{ secrets.MAVIS_GSC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: https://jroflcmiczfwtmiaxmpd.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OQAYkMnnChOJTutvi3kLfg_RnWEhEvs
        shell: bash
        run: |
          set -euo pipefail
          npm run indexnow:prepare
          node --input-type=module <<'NODE'
          import { resolveIndexNowKey } from "./scripts/indexnow-key-config.mjs";
          const key = await resolveIndexNowKey({
            key: process.env.INDEXNOW_KEY,
            publicDirectory: "public",
          });
          if (!key) {
            throw new Error("Production deploy requires one valid public IndexNow key file.");
          }
          console.log("IndexNow verification file and key configuration validated.");
          NODE

          npx opennextjs-cloudflare build

          if ! grep -R -F -q --binary-files=text "$NEXT_PUBLIC_GA_MEASUREMENT_ID" .open-next; then
            echo "::error::The production Worker bundle does not contain the configured Google Analytics measurement ID."
            exit 1
          fi
          echo "Google Analytics measurement ID is present in the production Worker bundle."

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const names = [
            "MAVIS_OPENAI_API_KEY",
            "MAVIS_IRAN_SOURCE_SEARCH_API_KEY",
            "MAVIS_GSC_CLIENT_ID",
            "MAVIS_GSC_CLIENT_SECRET",
            "MAVIS_GSC_TOKEN_ENCRYPTION_KEY",
            "MAVIS_GSC_SITE_URL",
          ];
          const gscNames = names.filter((name) => name.startsWith("MAVIS_GSC_"));
          const configuredGsc = gscNames.filter((name) => Boolean(process.env[name]?.trim()));
          if (configuredGsc.length > 0 && configuredGsc.length !== gscNames.length) {
            const missing = gscNames.filter((name) => !process.env[name]?.trim());
            throw new Error("Google Search Console credentials must be configured together: " + missing.join(", "));
          }
          const secrets = Object.fromEntries(
            names
              .filter((name) => typeof process.env[name] === "string" && process.env[name].trim())
              .map((name) => [name, process.env[name]])
          );
          const { resolveIndexNowKey } = await import("./scripts/indexnow-key-config.mjs");
          const indexNowKey = await resolveIndexNowKey({
            key: process.env.INDEXNOW_KEY,
            publicDirectory: "public",
          });
          if (!indexNowKey) {
            throw new Error("IndexNow key is required for automatic publication notifications.");
          }
          secrets.INDEXNOW_KEY = indexNowKey;
          fs.writeFileSync(".wrangler-runtime-secrets.json", JSON.stringify(secrets), { mode: 0o600 });
          console.log(`Prepared ${Object.keys(secrets).length} optional MAVIS runtime secrets without exposing their values.`);
          NODE

          npx wrangler deploy --dry-run --outdir .wrangler-production-dry-run 2>&1 | tee /tmp/wrangler-production-dry-run.log
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const log = fs.readFileSync("/tmp/wrangler-production-dry-run.log", "utf8");
          const match = log.match(/Total Upload:\s*[\d.]+\s*(?:B|KiB|MiB|GiB)\s*\/\s*gzip:\s*([\d.]+)\s*(B|KiB|MiB|GiB)/i);
          if (!match) {
            console.error("Could not verify the compressed Worker upload size.");
            process.exit(1);
          }
          const units = { B: 1, KiB: 1024, MiB: 1024 ** 2, GiB: 1024 ** 3 };
          const bytes = Number(match[1]) * units[match[2]];
          const limit = 3 * 1024 ** 2;
          console.log(`Compressed Worker: ${(bytes / 1024 / 1024).toFixed(2)} MiB / 3 MiB Free limit.`);
          if (bytes > limit) {
            console.error("Worker exceeds the Cloudflare Workers Free compressed bundle limit.");
            process.exit(1);
          }
          NODE

          npx wrangler deploy --secrets-file .wrangler-runtime-secrets.json

      - name: Verify production publication and analytics endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://vakilahmadmousavi.ir"
          article_path="/articles/unified-judicial-precedent-874-electronic-monitoring-before-prison"

          for route in "/" "/articles" "$article_path" "/sitemap.xml" "/robots.txt"; do
            echo "Checking $route"
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
              "$base$route" -o /tmp/vakilsite-smoke-response
          done


          sitemap="$(curl --fail --silent --show-error --location "$base/sitemap.xml")"
          if ! grep -Fq "$article_path" <<< "$sitemap"; then
            echo "::error::The published Unified Precedent 874 article is missing from the production sitemap."
            exit 1
          fi

          echo "Production routes, Google Analytics tag, and published-article sitemap entry verified."
