name: Deploy Vakilsite to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vakilsite-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
          echo "All required deployment credentials are present."

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Cloudflare tooling
        run: >-
          npm install --no-save --package-lock=false --no-audit --no-fund
          @opennextjs/cloudflare@1.20.17
          wrangler@4.161.0

      - name: Build and deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://vakilahmadmousavi.ir
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare build

          npx wrangler deploy --dry-run --outdir .wrangler-production-dry-run 2>&1 | tee /tmp/wrangler-production-dry-run.log
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const log = fs.readFileSync("/tmp/wrangler-production-dry-run.log", "utf8");
          const match = log.match(/Total Upload:\\s*[\\d.]+\\s*(?:B|KiB|MiB|GiB)\\s*\\/\\s*gzip:\\s*([\\d.]+)\\s*(B|KiB|MiB|GiB)/i);
          if (!match) {
            console.error("Could not verify the compressed Worker upload size.");
            process.exit(1);
          }
          const units = { B: 1, KiB: 1024, MiB: 1024 ** 2, GiB: 1024 ** 3 };
          const bytes = Number(match[1]) * units[match[2]];
          const limit = 3 * 1024 ** 2;
          console.log(`Compressed Worker: ${(bytes / 1024 / 1024).toFixed(2)} MiB / 3 MiB Free limit.`);
          if (bytes > limit) {
            console.error("Worker exceeds the Cloudflare Workers Free compressed bundle limit.");
            process.exit(1);
          }
          NODE

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const secrets = {
            NEXT_PUBLIC_SITE_URL: process.env.NEXT_PUBLIC_SITE_URL,
            NEXT_PUBLIC_SUPABASE_URL: process.env.NEXT_PUBLIC_SUPABASE_URL,
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          };
          for (const [key, value] of Object.entries(secrets)) {
            if (!value) throw new Error(`Missing required runtime variable: ${key}`);
          }
          fs.writeFileSync(".secrets.production.json", JSON.stringify(secrets), { mode: 0o600 });
          NODE
          trap 'rm -f .secrets.production.json' EXIT
          npx wrangler deploy --secrets-file .secrets.production.json
