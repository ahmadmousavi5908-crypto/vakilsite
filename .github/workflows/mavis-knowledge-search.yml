name: MAVIS deterministic knowledge search

on:
  push:
    branches:
      - feature/mavis-deterministic-legal-search-20261108
      - feature/mavis-intake-growth-foundation-20261108
  workflow_dispatch:
  pull_request:
    branches:
      - feature/mavis-deterministic-legal-search-20261108

permissions:
  contents: read

concurrency:
  group: mavis-knowledge-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://vakilsite-ci.example
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate the existing legal library
        run: python3 src/data/legal-library/validation/validate_library.py

      - name: Test deterministic MAVIS retrieval
        run: npm run test:mavis-search

      - name: Lint MAVIS retrieval modules
        run: npm run lint -- src/lib/mavis/knowledge-search.mjs src/lib/mavis/knowledge-registry.js src/lib/mavis/request-guards.mjs src/lib/mavis/rate-limit.mjs src/lib/supabase/admin.js src/app/api/mavis/knowledge-search/route.js src/components/admin/MavisKnowledgeSearch.jsx src/app/admin/mavis/page.js src/app/admin/page.js src/app/admin/login/page.js src/app/admin/login/actions.js tests/mavis/knowledge-search.test.mjs

      - name: Test public intake validation
        if: ${{ hashFiles('tests/mavis/public-intake-validation.test.mjs') != '' }}
        run: node --test tests/mavis/public-intake-validation.test.mjs

      - name: Test growth intelligence metrics
        if: ${{ hashFiles('tests/mavis/growth-metrics.test.mjs') != '' }}
        run: node --test tests/mavis/growth-metrics.test.mjs

      - name: Test Search Console adapter
        if: ${{ hashFiles('tests/mavis/search-console-adapter.test.mjs') != '' }}
        run: node --test tests/mavis/search-console-adapter.test.mjs

      - name: Test cautious legal intake triage
        if: ${{ hashFiles('tests/mavis/legal-intake-triage.test.mjs') != '' }}
        run: node --test tests/mavis/legal-intake-triage.test.mjs

      - name: Test intake request security guards
        if: ${{ hashFiles('tests/mavis/intake-request.test.mjs') != '' }}
        run: node --test tests/mavis/intake-request.test.mjs

      - name: Test admin intake API guards
        if: ${{ hashFiles('tests/mavis/intake-admin.test.mjs') != '' }}
        run: node --test tests/mavis/intake-admin.test.mjs

      - name: Lint intake and growth modules
        if: ${{ hashFiles('src/lib/mavis/public-intake-validation.mjs') != '' }}
        run: npm run lint -- src/lib/mavis/public-intake-validation.mjs src/lib/mavis/growth-metrics.mjs src/lib/mavis/legal-intake-triage.mjs tests/mavis/public-intake-validation.test.mjs tests/mavis/growth-metrics.test.mjs tests/mavis/legal-intake-triage.test.mjs

      - name: Lint intake API and server-only Supabase client
        if: ${{ hashFiles('src/app/api/mavis/intake/route.js') != '' }}
        run: npm run lint -- src/app/api/mavis/intake/route.js src/lib/mavis/intake-request.mjs src/lib/supabase/service.js tests/mavis/intake-request.test.mjs

      - name: Lint admin intake API
        if: ${{ hashFiles('src/app/api/admin/mavis/intake/route.js') != '' }}
        run: npm run lint -- src/app/api/admin/mavis/intake/route.js src/lib/mavis/intake-admin.mjs tests/mavis/intake-admin.test.mjs

      - name: Lint MAVIS admin intake inbox
        if: ${{ hashFiles('src/components/admin/MavisIntakeInbox.jsx') != '' }}
        run: npm run lint -- src/components/admin/MavisIntakeInbox.jsx src/app/admin/mavis/page.js

      - name: Lint Search Console adapter
        if: ${{ hashFiles('src/lib/mavis/search-console-adapter.mjs') != '' }}
        run: npm run lint -- src/lib/mavis/search-console-adapter.mjs tests/mavis/search-console-adapter.test.mjs

      - name: Build the site
        run: npm run build
