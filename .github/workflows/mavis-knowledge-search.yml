name: MAVIS deterministic knowledge search

on:
  push:
    branches:
      - feature/mavis-deterministic-legal-search-20261108
      - feature/mavis-offline-first-public-knowledge-20261108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavis-knowledge-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://vakilsite-ci.example
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate the existing legal library
        run: python3 src/data/legal-library/validation/validate_library.py

      - name: Test deterministic MAVIS retrieval
        run: npm run test:mavis-search

      - name: Validate offline application syntax
        run: |
          node --check public/mavis-offline/app.js
          node --check public/mavis-offline/search.mjs
          node --check public/mavis-offline/answer.mjs
          node --check public/mavis-offline/sw.js

      - name: Validate offline knowledge bundle and provenance
        run: node scripts/mavis/validate-offline-bundle.mjs

      - name: Test offline Persian search
        run: node --test tests/mavis/offline-search.test.mjs

      - name: Test offline shell and cache readiness contract
        run: node --test tests/mavis/offline-shell.test.mjs

      - name: Test deterministic offline answer composition
        run: node --test tests/mavis/offline-answer.test.mjs


      - name: Lint MAVIS retrieval modules
        run: npm run lint -- src/lib/mavis/knowledge-search.mjs src/lib/mavis/knowledge-registry.js src/lib/mavis/request-guards.mjs src/lib/mavis/rate-limit.mjs src/lib/supabase/admin.js src/app/api/mavis/knowledge-search/route.js src/components/admin/MavisKnowledgeSearch.jsx src/app/admin/mavis/page.js src/app/admin/page.js src/app/admin/login/page.js src/app/admin/login/actions.js tests/mavis/knowledge-search.test.mjs

      - name: Build the site
        run: npm run build
